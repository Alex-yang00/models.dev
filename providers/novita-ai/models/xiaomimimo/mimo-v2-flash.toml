# Toggle: thinking.type = enabled|disabled
# Route is no longer returned by Novita; control follows the first-party MiMo V2 Flash baseline.
base_model = "xiaomi/mimo-v2-flash"
structured_output = true

[[reasoning_options]]
type = "toggle"

[interleaved]
field = "reasoning_content"

[cost]
input = 0.1
output = 0.3
cache_read = 0.30

[limit]
output = 32_000
